<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>電子チケット デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5c4ca;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#292929}.top{height:58px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.logo{font-size:20px;font-weight:800;color:#2882bc}.logo span{color:#e75d76}.menu{font-size:23px}.stage{min-height:calc(100dvh - 132px);display:flex;align-items:center;justify-content:center;padding:24px 20px 95px;background:repeating-linear-gradient(140deg,#f5c4ca 0,#f5c4ca 50px,#f7cdd2 50px,#f7cdd2 100px)}.ticket{position:relative;width:min(340px,100%);background:white;box-shadow:0 4px 13px #0003}.poster{height:270px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#212b48,#c94e82 45%,#5aa6bd);color:white;text-align:center;font-weight:900;letter-spacing:3px;font-size:29px;text-shadow:0 2px 5px #0008}.details{padding:13px 13px 18px}.event{font-size:14px;font-weight:750;margin-bottom:12px}.venue{font-size:10px;font-weight:700}.date{display:flex;align-items:end;gap:13px;margin:4px 0 14px}.date strong{font-size:26px}.date small{font-size:10px}.date b{font-size:14px}.line{border-top:1px dashed #bbb;margin-bottom:10px}.bottom{display:flex;align-items:end;justify-content:space-between}.type{font-size:12px;font-weight:700}.number{background:#e52b48;color:white;font-size:19px;padding:4px 7px;font-weight:800}.bar{position:fixed;bottom:0;width:100%;height:76px;background:#fff;display:flex;align-items:flex-start;padding:9px 15px;gap:13px}.minor{font-size:12px;text-align:center;width:45px;padding-top:6px}.enter{border:0;border-radius:25px;color:white;background:#e42c47;font-size:15px;font-weight:750;flex:1;height:44px;cursor:pointer}.enter:disabled{background:#bbb;color:white}.stamp{display:none;position:absolute;top:75px;right:7px;width:145px;height:145px;border:5px double #ef2028;border-radius:50%;color:#ed2229;background:#ffffffd9;transform:rotate(-8deg);text-align:center;flex-direction:column;align-items:center;justify-content:center;font-weight:900;z-index:2}.stamp:before{content:'';position:absolute;inset:10px;border:2px solid #ed2229;border-radius:50%}.stamp .big{font-size:29px;border-top:2px solid #e22;border-bottom:2px solid #e22;margin:7px 0;padding:3px}.stamp small{font-size:12px}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:5;padding:20px}.modal{position:relative;background:#fff;width:min(355px,100%);border-radius:11px;padding:40px 17px 25px;text-align:center}.close{position:absolute;right:15px;top:9px;background:none;border:0;font-size:24px;cursor:pointer}.warn{font-size:14px;color:red;font-weight:850;margin:0 0 4px}.question{font-size:14px;font-weight:750;margin:0}.explain{text-align:left;font-size:10px;color:#777;margin:28px 0 30px;line-height:1.7}.actions{display:flex;gap:13px}.actions button{width:50%;border:0;border-radius:30px;height:39px;font-weight:750;font-size:12px}.cancel{background:#f2f2f2;color:#555}.confirm{background:#56ace7;color:#fff}.reset{position:fixed;right:8px;top:65px;font-size:10px;border:1px solid #999;background:#fffd;padding:5px 7px;border-radius:5px;z-index:3}

body{background:#f5b8c0;color:#28282b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}

</style></head><body><header class="top"><div class="logo">◇ <span>Entry</span> Pass</div><div class="menu">⌕　☰</div></header><main class="stage"><article class="ticket"><div class="poster">NEO<br>IDOL EVENT<br><small style="font-size:12px;letter-spacing:1px">DIGITAL ENTRY PASS</small></div><div class="stamp" id="stamp"><small>入場済</small><div class="big" id="time">13:33</div><small>検証済</small></div><div class="details"><div class="event">6月　『NEO IDOL EVENT』</div><div class="venue">新宿DHNoA（デモ会場）</div><div class="date"><strong id="date">10.21</strong><b>水</b><small>OPEN<br><b>14:20</b></small><small>START<br><b>14:35</b></small></div><div class="line"></div><div class="bottom"><div><small>一般入場券</small><div class="type">一般・0円　※デモ</div></div><div class="number">B-247</div></div></div></article></main><div class="bar"><div class="minor">↕<br>分配する</div><div class="minor">↗<br>詳細</div><button class="enter" id="enter">入場する<br><span style="font-size:9px">（係員操作用）</span></button></div><button class="reset" id="reset">デモをリセット</button><div class="overlay" id="overlay"><div class="modal"><button class="close" id="close">×</button><p class="warn">必ず係員が操作してください</p><p class="question">本当に入場しますか？</p><p class="explain">誤って入場するを押した場合、この操作は取り消せません。</p><div class="actions"><button class="cancel" id="cancel">キャンセル</button><button class="confirm" id="confirm">入場する</button></div></div></div><script>const $=x=>document.getElementById(x),key='ticket-demo-admitted';function refresh(){const t=localStorage.getItem(key);$('stamp').style.display=t?'flex':'none';$('enter').disabled=!!t;$('enter').innerHTML=t?'ボタンタップにより入場済':'入場する<br><span style="font-size:9px">（係員操作用）</span>';if(t)$('time').textContent=t}refresh();$('enter').onclick=()=>{$('overlay').style.display='flex'};function hide(){$('overlay').style.display='none'}$('close').onclick=hide;$('cancel').onclick=hide;$('confirm').onclick=()=>{const d=new Date(),t=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false});localStorage.setItem(key,t);hide();refresh()};$('reset').onclick=()=>{if(confirm('デモの入場状態をリセットしますか？')){localStorage.removeItem(key);refresh()}};</script></body></html>
