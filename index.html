<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Ticket Auto</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f3f6fc;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}.wrap{max-width:520px;margin:auto;padding:28px 20px 48px}h1{margin:0;font-size:29px}p{color:#aab8d1;line-height:1.55}.card{background:#17243a;border:1px solid #2a3b56;border-radius:20px;padding:20px;margin-top:20px}label{display:block;margin:15px 0 7px;font-weight:600;font-size:14px}input,select{width:100%;border:1px solid #41516a;border-radius:12px;background:#0c1627;color:white;padding:14px;font-size:16px}button,a.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;margin-top:16px;background:#5d89ff;color:#fff;text-align:center;font-size:16px;font-weight:700;text-decoration:none}button.secondary{background:#30435f}.count{font-size:40px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:20px 0 6px}.small{text-align:center;font-size:13px;color:#aab8d1}.notice{font-size:13px;color:#d4dfef}.status{color:#9dc3ff;font-weight:600;text-align:center}</style></head><body><main class="wrap"><h1>🎟 Ticket Auto</h1><p>自分専用・TicketDIVE発売時刻アシスタント</p><section class="card"><label for="url">公演URL</label><input id="url" type="url" placeholder="https://ticketdive.com/event/..."><label for="ticket">希望券種（メモ）</label><input id="ticket" placeholder="例：前方チケット"><label for="quantity">希望枚数（メモ）</label><select id="quantity"><option>1</option><option>2</option><option>3</option><option>4</option></select><label for="date">発売日</label><input id="date" type="date"><label for="time">発売時刻（秒単位）</label><input id="time" type="time" step="1" value="21:00:00"><button id="save">設定を保存</button></section><section class="card"><div class="small">発売まで</div><div class="count" id="count">--:--:--</div><div class="status" id="status">発売日時を設定してください</div><button id="arm">カウントダウン開始</button><a id="open" class="btn" href="#" target="_blank" rel="noopener noreferrer">購入ページを開く</a><p class="notice">※ 発売時に自動でページを開こうとしますが、Safariのポップアップ制限により開かない場合があります。確実に開けるよう、上のボタンも用意しています。画面を開いたままにしてください。券種・枚数の選択と購入確定は手動です。</p></section></main><script>const ids=['url','ticket','quantity','date','time'];const $=id=>document.getElementById(id);let active=false,opened=false;try{const d=JSON.parse(localStorage.getItem('ticket-auto')||'{}');ids.forEach(k=>{if(d[k])$(k).value=d[k]})}catch(e){}function validUrl(){try{let u=new URL($('url').value);return u.protocol==='https:'&&u.hostname==='ticketdive.com'&&u.pathname.startsWith('/event/')}catch(e){return false}}function target(){return new Date($('date').value+'T'+$('time').value).getTime()}function update(){let ms=target()-Date.now();if(!Number.isFinite(ms)){ $('count').textContent='--:--:--';return}if(ms<=0){$('count').textContent='00:00:00';$('status').textContent='発売予定時刻になりました';if(active&&!opened){opened=true;try{window.open($('url').value,'_blank','noopener,noreferrer')}catch(e){} }return}let s=Math.ceil(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;$('count').textContent=(d?d+'日 ':'')+[h,m,sec].map(n=>String(n).padStart(2,'0')).join(':');if(active)$('status').textContent='待機中（画面を開いたままにしてください）'}$('save').onclick=()=>{if(!validUrl()){alert('ticketdive.com の公演URLを入力してください');return}if(!Number.isFinite(target())){alert('発売日時を設定してください');return}localStorage.setItem('ticket-auto',JSON.stringify(Object.fromEntries(ids.map(k=>[k,$(k).value]))));$('open').href=$('url').value;$('status').textContent='設定を保存しました';update()};$('arm').onclick=()=>{if(!validUrl()||!Number.isFinite(target())){alert('正しいURLと発売日時を入力してください');return}if(target()<=Date.now()){alert('未来の発売日時を設定してください');return}active=true;opened=false;$('open').href=$('url').value;$('status').textContent='待機中';update()};$('open').onclick=e=>{if(!validUrl()){e.preventDefault();alert('公演URLを設定してください')}};if(validUrl())$('open').href=$('url').value;setInterval(update,200);update();</script></body></html>
