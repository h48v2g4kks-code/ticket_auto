<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Ticket Auto v4</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f3f6fc;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}.wrap{max-width:520px;margin:auto;padding:28px 20px 48px}h1{margin:0;font-size:29px}p{color:#aab8d1;line-height:1.55}.card{background:#17243a;border:1px solid #2a3b56;border-radius:20px;padding:20px;margin-top:20px}label{display:block;margin:15px 0 7px;font-weight:600;font-size:14px}input,select{width:100%;border:1px solid #41516a;border-radius:12px;background:#0c1627;color:white;padding:14px;font-size:16px}button,a.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;margin-top:16px;background:#5d89ff;color:#fff;text-align:center;font-size:16px;font-weight:700;text-decoration:none}button.secondary{background:#30435f}.count{font-size:40px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:20px 0 6px}.small{text-align:center;font-size:13px;color:#aab8d1}.notice{font-size:13px;color:#d4dfef}.status{color:#9dc3ff;font-weight:600;text-align:center}</style></head><body><main class="wrap"><h1>🎟 Ticket Auto</h1><p>自分専用・TicketDIVE発売時刻アシスタント</p><section class="card"><label for="eventList">保存済みの公演</label><select id="eventList"><option value="">新しい公演を登録</option></select><button id="newEvent" class="secondary" type="button">新しい公演を入力</button><label for="url">公演URL</label><input id="url" type="url" placeholder="https://ticketdive.com/event/..."><label for="ticket">希望券種（自由入力・メモ）</label><input id="ticket" placeholder="例：前方チケット"><label for="quantity">購入枚数</label><input id="quantity" value="1枚（固定）" disabled><label for="date">発売日</label><input id="date" type="date"><label for="time">発売時刻（秒単位）</label><input id="time" type="time" step="1" value="21:00:00"><button id="save">この公演の設定を保存</button></section><section class="card"><div class="small">発売まで</div><div class="count" id="count">--:--:--</div><div class="status" id="status">発売日時を設定してください</div><div class="status" id="diag" style="white-space:pre-wrap;font-size:13px;margin-top:10px">診断：未開始</div><button id="arm">カウントダウン開始</button><a id="open" class="btn" href="#" target="_blank" rel="noopener noreferrer">購入ページを開く</a><p class="notice">※ 発売時に現在の画面から購入ページへ移動します。iPhoneの画面ロックや省電力状態などでは動作が遅れたり失敗する場合があります。確実に開けるよう、上のボタンも用意しています。画面を開いたままにしてください。券種の指定はメモとして保存されます。TicketDIVE側での券種選択・枚数1枚の指定・購入確定は手動です。</p></section></main><script>const $=id=>document.getElementById(id);
const fields=['url','ticket','date','time'];
const storageKey='ticket-auto-v4-events';
let active=false,opened=false;
const log=m=>{$('diag').textContent='診断：'+m};
function allEvents(){try{const x=JSON.parse(localStorage.getItem(storageKey)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}catch(e){return {}}}
function validUrl(){try{const u=new URL($('url').value.trim());return u.protocol==='https:'&&u.hostname==='ticketdive.com'&&u.pathname.startsWith('/event/')}catch(e){return false}}
function target(){return new Date($('date').value+'T'+$('time').value).getTime()}
function currentData(){return Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]))}
function setData(d){fields.forEach(k=>$(k).value=d[k]||'');$('open').href=validUrl()?$('url').value:'#';active=false;opened=false;log('未開始');update()}
function renderEvents(selected=''){const ev=allEvents();$('eventList').innerHTML='<option value="">新しい公演を登録</option>';Object.entries(ev).forEach(([url,d])=>{const o=document.createElement('option');o.value=url;o.textContent=(d.ticket||'券種未設定')+' ｜ '+(d.date||'日付未設定')+' ｜ '+url.split('/').filter(Boolean).pop();$('eventList').append(o)});$('eventList').value=selected&&ev[selected]?selected:''}
function update(){const ms=target()-Date.now();if(!Number.isFinite(ms)){$('count').textContent='--:--:--';return}if(ms<=0){$('count').textContent='00:00:00';if(active&&!opened){opened=true;log('時刻到達・移動を実行 '+new Date().toLocaleTimeString());try{sessionStorage.setItem('ticket-auto-last-attempt',new Date().toISOString());window.location.replace($('url').value.trim())}catch(e){log('移動エラー：'+String(e));$('status').textContent='移動できませんでした。購入ページを開くを押してください'}}else if(!active){$('status').textContent='発売予定時刻になりました'}return}const secs=Math.ceil(ms/1000),d=Math.floor(secs/86400),h=Math.floor(secs%86400/3600),m=Math.floor(secs%3600/60),ss=secs%60;$('count').textContent=(d?d+'日 ':'')+[h,m,ss].map(n=>String(n).padStart(2,'0')).join(':');if(active)$('status').textContent='待機中（画面を開いたままにしてください）'}
$('eventList').onchange=()=>{const d=allEvents()[$('eventList').value];if(d){setData(d);$('status').textContent='保存済みの公演を読み込みました'}else{setData({time:'21:00:00'});$('status').textContent='新しい公演を入力してください'}};
$('newEvent').onclick=()=>{$('eventList').value='';setData({time:'21:00:00'});$('status').textContent='新しい公演を入力してください'};
$('save').onclick=()=>{if(!validUrl()){alert('ticketdive.com の公演URLを入力してください');return}if(!Number.isFinite(target())){alert('発売日時を設定してください');return}const d=currentData(),ev=allEvents();ev[d.url]=d;try{localStorage.setItem(storageKey,JSON.stringify(ev));localStorage.setItem('ticket-auto',JSON.stringify({...d,quantity:'1'}))}catch(e){alert('保存できませんでした。Safariのストレージ設定を確認してください');return}renderEvents(d.url);$('open').href=d.url;$('status').textContent='この公演の設定を保存しました';update()};
$('arm').onclick=()=>{if(!validUrl()||!Number.isFinite(target())){alert('正しいURLと発売日時を入力してください');return}if(target()<=Date.now()){alert('未来の発売日時を設定してください');return}active=true;opened=false;log('待機開始 '+new Date().toLocaleTimeString()+' / 予定 '+new Date(target()).toLocaleTimeString());$('open').href=$('url').value.trim();$('status').textContent='待機中';update()};
$('open').onclick=e=>{if(!validUrl()){e.preventDefault();alert('公演URLを設定してください')}};
renderEvents();const ev=allEvents();const urls=Object.keys(ev);if(urls.length){const last=urls[urls.length-1];renderEvents(last);setData(ev[last])}else{try{const old=JSON.parse(localStorage.getItem('ticket-auto')||'{}');setData(old)}catch(e){setData({time:'21:00:00'})}}setInterval(update,200);update();</script></body></html>
